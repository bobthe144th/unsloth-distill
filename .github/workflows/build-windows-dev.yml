# Builds an unsigned Windows NSIS installer (.exe) on demand.
# Output is uploaded as a GitHub Actions artifact — ready to download and run
# on Windows without needing code-signing secrets.
#
# For signed production releases (Azure Trusted Signing + full PyPI validation),
# use release-desktop.yml (workflow_dispatch with studio_version + pypi_version).
#
# This workflow intentionally:
#   - Does NOT use tauri.windows.conf.json (skips Azure Trusted Signing)
#   - Sets TAURI_SIGNING_PRIVATE_KEY='' (disables updater-artifact signing)
#   - Does NOT validate PyPI version (builds whatever is in Cargo.toml)

name: Build Windows .exe (dev, unsigned)

on:
  workflow_dispatch:

concurrency:
  group: build-windows-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Windows NSIS installer (unsigned)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - name: Install pinned Tauri CLI
        run: npm install --save-dev --prefix studio @tauri-apps/cli@2.10.1 --no-fund --no-audit

      - name: Verify pinned Tauri CLI version
        shell: bash
        run: |
          out="$(npx --prefix studio tauri --version)"
          echo "$out"
          [ "$out" = "tauri-cli 2.10.1" ] || { echo "::error::expected tauri-cli 2.10.1, got $out"; exit 1; }

      - name: Frontend build
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1
        with:
          workspaces: studio/src-tauri -> target

      - name: Build Tauri Windows installer (unsigned)
        working-directory: studio
        env:
          # Empty key disables updater-artifact signing; no Azure creds = no exe signing.
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        # Override signCommand to null so tauri.windows.conf.json's trusted-signing-cli
        # entry is not used (it's not installed on this runner).
        run: npx tauri build --config '{"bundle":{"windows":{"signCommand":null}}}'

      - name: Locate installer
        shell: bash
        run: |
          EXE=$(find studio/src-tauri/target/release/bundle/nsis -name '*.exe' 2>/dev/null | head -1)
          echo "installer: $EXE"
          if [ -z "$EXE" ]; then
            echo "::error::NSIS installer not produced"
            ls -la studio/src-tauri/target/release/bundle/ || true
            exit 1
          fi
          du -h "$EXE"

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsloth-studio-windows-unsigned
          path: studio/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
